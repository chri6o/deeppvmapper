# Open-data orthophoto services used by pvmapper.
#
# Field reference
#   name                 human-readable label (shown in the web UI)
#   type                 wms | xyz   (xyz = WMTS/tile template in EPSG:3857, {z}/{x}/{y})
#   url, layers, crs     WMS endpoint, layer name, request CRS (metric CRS preferred)
#   native_resolution_m  ground resolution of the imagery behind the service
#   bbox                 WGS84 [minlon, minlat, maxlon, maxlat] — rough coverage used
#                        for routing; blank responses fall through to the next source
#   priority             lower = preferred when several sources cover a point
#   concurrency          max parallel requests (be polite to public services)
#   min_interval_s       optional delay between requests
#   license/attribution  as stated in the service capabilities — verify before publishing
#
# Endpoints were checked with live GetCapabilities/GetMap requests in Nov 2026.
# Add your own services in a separate file and load it with --sources-extra / the UI.

sources:

  # ---------------------------------------------------------------- Germany
  de-nw:
    name: "DE · Nordrhein-Westfalen · DOP10 (Geobasis NRW)"
    country: DE
    region: Nordrhein-Westfalen
    type: wms
    url: https://www.wms.nrw.de/geobasis/wms_nw_dop
    layers: nw_dop_rgb
    crs: EPSG:25832
    native_resolution_m: 0.1
    bbox: [5.86, 50.32, 9.46, 52.53]
    license: dl-de/zero-2.0
    attribution: "© Geobasis NRW"
    priority: 10
    alt: [de-nw-2024, de-nw-2023, de-nw-2022]
    nir_layer: nw_dop_nir         # near infrared of the current flight (training data)
    history:                      # older flights for the installation age: dates and resolution per place from the metadata layer
      kind: nrw_info
      url: https://www.wms.nrw.de/geobasis/wms_nw_hist_dop
      info_layer: nw_hist_dop_info
      layer: "nw_hist_dop_{year}"
      crs: EPSG:25832
      current_info: {url: "https://www.wms.nrw.de/geobasis/wms_nw_dop", layer: nw_dop_utm_info}   # flight date of the current image

